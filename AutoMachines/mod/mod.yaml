title: "Auto Machines"
description: "Makes duplicant-operated fabricators run on their own once materials are delivered. Covers 25 buildings across the base game and every DLC — Rock Crusher, Metal Refinery, Glass Forge, Supermaterial Refinery, the cookers, Apothecary, Sludge Press, Diamond Press, Plywood Press, Plant Pulverizer, Emulsifier, Deep Fryer, Sushi Bar, Crafting and Soldering Stations, Blastshot Maker, Nuclear Apothecary and more. Patches the existing buildings in place instead of cloning them, so recipes, outputs and masses stay exactly vanilla. Each building can be toggled from the mod's options screen in the Mods menu."
staticID: ONI.AutoMachines
