title: "Lumen"
description: "Five new motion-activated light fixtures, unlocked alongside the Duplicant Motion Sensor. Each draws 1 W and stays dark until a Duplicant walks into range, so Duplicants still get the lit-workspace work speed bonus without lighting an empty base. Vanilla lights are left untouched. Every fixture's power, sensor reach and linger time can be tuned, or the fixture switched off, from the mod's options screen in the Mods menu."
staticID: ONI.Lumen
